<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нейросеть учится · Fable 5.2</title>
<style>
:root{--bg:#0c0c0b;--ink:#f2eee3;--mute:#a09c8f;--acc:#ffd84d;--line:rgba(242,238,227,.2);--a:#ff8a5c;--b:#7fb5ff;
  --mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hud{position:fixed;z-index:5;left:28px;top:22px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hud h1{margin:0;font:500 34px/1.05 Charter,"Iowan Old Style","PT Serif",Georgia,serif;letter-spacing:-.01em}
.hud p{margin:8px 0 0;color:var(--mute);max-width:70ch;font-size:14.5px}
.hud p i{font-style:normal;color:var(--a)}.hud p u{text-decoration:none;color:var(--b)}
.nav{display:flex;gap:8px;flex:none}
.nav a,.pill{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;border-radius:999px;
  font-weight:500;font-size:13.5px;line-height:1;font-family:inherit;text-decoration:none;cursor:pointer}
.nav a:hover,.pill:hover{border-color:rgba(242,238,227,.6)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#14130f}
.stage{position:fixed;left:28px;right:28px;top:132px;bottom:74px;display:grid;grid-template-columns:auto minmax(320px,1fr);gap:28px}
#map{height:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;cursor:crosshair;display:block;max-width:58vw}
.side{display:grid;grid-template-rows:1fr auto;gap:16px;min-width:0;min-height:0}
#net{width:100%;height:100%;min-height:0;border:1px solid var(--line);border-radius:10px;display:block}
.row{display:grid;grid-template-columns:1.3fr 1fr 1.25fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;overflow:hidden}
.box small{display:block;font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.box b{font:500 24px/1 Charter,"PT Serif",Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
#loss{width:100%;height:44px;display:block}
.bar{position:fixed;z-index:5;left:28px;bottom:20px;right:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gap{width:12px}
</style>
</head>
<body>
<div class="hud">
  <div>
    <h1>Нейросеть учится</h1>
    <p>Маленькая сеть прямо в браузере учится отличать <i>оранжевые</i> точки от <u>синих</u>. Фон – то, как она сейчас видит мир. Клик добавляет оранжевую точку, клик с Shift – синюю. Наведите на нейрон – увидите, за что отвечает он один.</p>
  </div>
  <nav class="nav"><a href="blackhole.html">← Назад</a><a href="index.html">Все демо</a><a href="os.html">Дальше →</a></nav>
</div>
<div class="stage">
  <canvas id="map"></canvas>
  <div class="side">
    <canvas id="net"></canvas>
    <div class="row">
      <div class="box"><small>Ошибка</small><canvas id="loss"></canvas></div>
      <div class="box"><small>Угадывает</small><b id="acc">0%</b></div>
      <div class="box"><small>Шагов</small><b id="steps">0</b></div>
      <div class="box"><small>Параметров</small><b id="params">0</b></div>
    </div>
  </div>
</div>
<div class="bar" id="bar"></div>
<script>
const L = [2, 20, 20, 1], NL = L.length - 1, TAU = Math.PI * 2;
let Wt, B, mW, vW, mB, vB, gW, gB, A, DL, steps = 0, lr = 0.01, paused = false, lossHist = [], acc = 0;
function initNet() {
  Wt = []; B = []; mW = []; vW = []; mB = []; vB = []; gW = []; gB = [];
  for (let l = 0; l < NL; l++) {
    const n = L[l] * L[l + 1], w = new Float64Array(n), s = Math.sqrt(6 / (L[l] + L[l + 1]));
    for (let i = 0; i < n; i++) w[i] = (Math.random() * 2 - 1) * s;
    Wt.push(w); B.push(new Float64Array(L[l + 1]));
    mW.push(new Float64Array(n)); vW.push(new Float64Array(n)); gW.push(new Float64Array(n));
    mB.push(new Float64Array(L[l + 1])); vB.push(new Float64Array(L[l + 1])); gB.push(new Float64Array(L[l + 1]));
  }
  A = L.map(n => new Float64Array(n)); DL = L.map(n => new Float64Array(n));
  steps = 0; lossHist = [];
}
function forward(x, y) {
  A[0][0] = x * 2.2; A[0][1] = y * 2.2;
  for (let l = 0; l < NL; l++) {
    const nin = L[l], nout = L[l + 1], w = Wt[l], b = B[l], o = A[l + 1], inp = A[l], last = l === NL - 1;
    for (let j = 0; j < nout; j++) {
      let s = b[j]; const off = j * nin;
      for (let i = 0; i < nin; i++) s += w[off + i] * inp[i];
      o[j] = last ? 1 / (1 + Math.exp(-s)) : Math.tanh(s);
    }
  }
  return A[NL][0];
}
// один шаг обучения: прогнать все точки, посчитать, кто из весов виноват в ошибке, и чуть их подвинуть
function train() {
  for (let l = 0; l < NL; l++) { gW[l].fill(0); gB[l].fill(0); }
  let loss = 0, ok = 0; const n = pts.length;
  for (const p of pts) {
    const out = forward(p[0], p[1]);
    loss -= p[2] ? Math.log(out + 1e-9) : Math.log(1 - out + 1e-9);
    if ((out > .5) === (p[2] === 1)) ok++;
    DL[NL][0] = out - p[2];
    for (let l = NL - 1; l >= 0; l--) {
      const nin = L[l], nout = L[l + 1], w = Wt[l], inp = A[l], d = DL[l + 1], dp = DL[l];
      dp.fill(0);
      for (let j = 0; j < nout; j++) {
        const dj = d[j], off = j * nin; gB[l][j] += dj;
        for (let i = 0; i < nin; i++) { gW[l][off + i] += dj * inp[i]; dp[i] += w[off + i] * dj; }
      }
      if (l > 0) for (let i = 0; i < nin; i++) dp[i] *= 1 - inp[i] * inp[i];
    }
  }
  steps++;
  const b1 = .9, b2 = .999, c1 = 1 - Math.pow(b1, steps), c2 = 1 - Math.pow(b2, steps);
  const upd = (w, g, m, v) => { for (let i = 0; i < w.length; i++) { const gi = g[i] / n; m[i] = b1 * m[i] + (1 - b1) * gi; v[i] = b2 * v[i] + (1 - b2) * gi * gi; w[i] -= lr * (m[i] / c1) / (Math.sqrt(v[i] / c2) + 1e-8); } };
  for (let l = 0; l < NL; l++) { upd(Wt[l], gW[l], mW[l], vW[l]); upd(B[l], gB[l], mB[l], vB[l]); }
  acc = ok / n; return loss / n;
}

/* ---------- данные ---------- */
let pts = [];
const g = () => (Math.random() + Math.random() + Math.random() - 1.5) * .035;
const DATA = {
  'Спираль': () => { for (let c = 0; c < 2; c++) for (let i = 0; i < 110; i++) { const k = i / 110, r = .08 + k * .8, a = k * 1.5 * TAU + c * Math.PI; pts.push([r * Math.cos(a) + g(), r * Math.sin(a) + g(), c]); } },
  'Круги': () => { for (let i = 0; i < 220; i++) { const c = i % 2, r = c ? .68 + g() * 2 : Math.random() * .3, a = Math.random() * TAU; pts.push([r * Math.cos(a), r * Math.sin(a), c]); } },
  'Крест': () => { for (let i = 0; i < 220; i++) { const x = Math.random() * 1.7 - .85, y = Math.random() * 1.7 - .85; if (Math.abs(x) < .06 || Math.abs(y) < .06) continue; pts.push([x, y, x * y > 0 ? 1 : 0]); } },
  'Две луны': () => { for (let i = 0; i < 220; i++) { const c = i % 2, a = Math.random() * Math.PI; pts.push(c ? [.5 - Math.cos(a) * .6 - .25 + g() * 2, .22 - Math.sin(a) * .6 + g() * 2, 1] : [Math.cos(a) * .6 - .25 + g() * 2, Math.sin(a) * .6 - .22 + g() * 2, 0]); } }
};
function setData(k) { pts = []; DATA[k](); initNet(); }

/* ---------- картинка ---------- */
const map = document.getElementById('map'), mc = map.getContext('2d'), net = document.getElementById('net'), nc = net.getContext('2d');
const lossC = document.getElementById('loss'), lc = lossC.getContext('2d');
const G = 72, small = document.createElement('canvas'); small.width = small.height = G;
const sc = small.getContext('2d'), img = sc.createImageData(G, G);
let probe = null, nodes = [];
function fit(c) { const r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); c.width = Math.max(2, r.width * d | 0); c.height = Math.max(2, r.height * d | 0); return d; }
function resize() { fit(map); fit(net); fit(lossC); }
addEventListener('resize', resize);
function drawMap() {
  const d = img.data;
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const out = forward((i + .5) / G * 2 - 1, (j + .5) / G * 2 - 1);
    const p = probe ? A[probe[0]][probe[1]] * .5 + .5 : out, k = Math.min(1, Math.abs(p - .5) * 2.2), o = (j * G + i) * 4;
    const c = p > .5 ? [255, 138, 92] : [127, 181, 255];      // у границы фон темнеет: там сеть сомневается
    d[o] = 20 + (c[0] - 20) * k * .62; d[o + 1] = 19 + (c[1] - 19) * k * .62; d[o + 2] = 16 + (c[2] - 16) * k * .62; d[o + 3] = 255;
  }
  sc.putImageData(img, 0, 0);
  const W = map.width, s = W / 2;
  mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high'; mc.drawImage(small, 0, 0, W, W);
  mc.lineWidth = W * .0022; mc.strokeStyle = '#14130f';
  for (const p of pts) { mc.fillStyle = p[2] ? '#ff8a5c' : '#7fb5ff'; mc.beginPath(); mc.arc(s + p[0] * s, s + p[1] * s, W * .0085, 0, TAU); mc.fill(); mc.stroke(); }
}
function drawNet() {
  const W = net.width, H = net.height, d = W / net.getBoundingClientRect().width;
  nc.clearRect(0, 0, W, H); nodes = [];
  const pos = (l, j) => [W * (.12 + l * .76 / NL), H / 2 + (j - (L[l] - 1) / 2) * Math.min(H * .86 / L[l], 46 * d)];
  for (let l = 0; l < NL; l++) {
    let mx = 1e-6; for (const w of Wt[l]) mx = Math.max(mx, Math.abs(w));
    for (let j = 0; j < L[l + 1]; j++) for (let i = 0; i < L[l]; i++) {
      const w = Wt[l][j * L[l] + i], k = Math.abs(w) / mx; if (k < .08) continue;
      const [x1, y1] = pos(l, i), [x2, y2] = pos(l + 1, j);
      nc.strokeStyle = w > 0 ? `rgba(255,138,92,${k * .8})` : `rgba(127,181,255,${k * .8})`; nc.lineWidth = (.4 + k * 2.4) * d;
      nc.beginPath(); nc.moveTo(x1, y1); nc.lineTo(x2, y2); nc.stroke();
    }
  }
  forward(0, 0);
  for (let l = 0; l <= NL; l++) for (let j = 0; j < L[l]; j++) {
    const [x, y] = pos(l, j), r = (l === 0 || l === NL ? 9 : 6.5) * d, on = probe && probe[0] === l && probe[1] === j;
    nodes.push([x / d, y / d, l, j]);
    nc.fillStyle = on ? '#ffd84d' : '#f2eee3'; nc.beginPath(); nc.arc(x, y, r, 0, TAU); nc.fill();
    if (on) { nc.strokeStyle = '#ffd84d'; nc.lineWidth = 2 * d; nc.beginPath(); nc.arc(x, y, r + 5 * d, 0, TAU); nc.stroke(); }
  }
  nc.fillStyle = '#a09c8f'; nc.font = `${11 * d}px ui-monospace,Menlo,monospace`; nc.textAlign = 'center';
  ['вход: x и y', '20 нейронов', '20 нейронов', 'ответ'].forEach((t, l) => nc.fillText(t, pos(l, 0)[0], H - 10 * d));
}
function drawLoss() {
  const W = lossC.width, H = lossC.height; lc.clearRect(0, 0, W, H);
  if (lossHist.length < 2) return;
  lc.strokeStyle = '#ffd84d'; lc.lineWidth = 2 * (W / lossC.getBoundingClientRect().width); lc.beginPath();
  lossHist.forEach((v, i) => { const x = i / (lossHist.length - 1) * W, y = H - 3 - Math.min(1, v / .72) * (H - 6); i ? lc.lineTo(x, y) : lc.moveTo(x, y); });
  lc.stroke();
}

/* ---------- управление ---------- */
const bar = document.getElementById('bar');
bar.innerHTML = Object.keys(DATA).map((k, i) => `<button class="pill${i ? '' : ' on'}" data-d="${k}">${k}</button>`).join('') +
  '<span class="gap"></span><button class="pill" data-a="reset">Забыть всё</button><button class="pill" data-a="pause">Пауза</button><button class="pill" data-a="lr">Скорость обучения: обычная</button>';
bar.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) { setData(b.dataset.d); bar.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x === b)); }
  else if (b.dataset.a === 'reset') initNet();
  else if (b.dataset.a === 'pause') { paused = !paused; b.classList.toggle('on', paused); }
  else { lr = lr === .01 ? .03 : lr === .03 ? .003 : .01; b.textContent = 'Скорость обучения: ' + (lr === .01 ? 'обычная' : lr === .03 ? 'быстрая' : 'медленная'); }
});
map.addEventListener('pointerdown', e => {
  const r = map.getBoundingClientRect();
  pts.push([(e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1, e.shiftKey || e.button === 2 ? 0 : 1]);
});
map.addEventListener('contextmenu', e => e.preventDefault());
net.addEventListener('pointermove', e => {
  const r = net.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; probe = null;
  for (const [nx, ny, l, j] of nodes) if (l > 0 && Math.hypot(nx - x, ny - y) < 11) probe = [l, j];
});
net.addEventListener('pointerleave', () => probe = null);

document.getElementById('params').textContent = L.slice(1).reduce((s, n, i) => s + n * L[i] + n, 0);
let fr = 0;
function frame() {
  if (!paused && pts.length) { let l = 0; for (let i = 0; i < 12; i++) l = train(); if (fr % 3 === 0) { lossHist.push(l); if (lossHist.length > 260) lossHist.shift(); } }
  drawMap(); if (fr % 2 === 0) drawNet(); drawLoss();
  document.getElementById('acc').textContent = Math.round(acc * 100) + '%';
  document.getElementById('steps').textContent = steps.toLocaleString('ru-RU');
  fr++; requestAnimationFrame(frame);
}
setData('Спираль'); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
