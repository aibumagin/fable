<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фигуры звука · Fable 5.2</title>
<style>
:root{--bg:#0c0c0b;--ink:#f2eee3;--mute:#a09c8f;--acc:#ffd84d;--line:rgba(242,238,227,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 46%,#191814,#0c0c0b 62%);color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#plate{touch-action:none;position:fixed;left:50%;top:53%;transform:translate(-50%,-50%);border:1px solid rgba(242,238,227,.28);cursor:crosshair;background:#0a0a09;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.hud{position:fixed;z-index:5;left:28px;top:22px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none}
.hud h1{margin:0;font:500 34px/1.05 Charter,"Iowan Old Style","PT Serif",Georgia,serif;letter-spacing:-.01em}
.hud p{margin:8px 0 0;color:var(--mute);max-width:56ch;font-size:14.5px}
.nav{display:flex;gap:8px;pointer-events:auto;flex:none}
.nav a,.pill{border:1px solid var(--line);background:rgba(12,12,11,.55);color:var(--ink);padding:9px 14px;border-radius:999px;
  font-weight:500;font-size:13.5px;line-height:1;font-family:inherit;text-decoration:none;cursor:pointer}
.nav a:hover,.pill:hover{border-color:rgba(242,238,227,.6)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#14130f}
.bar{position:fixed;z-index:5;left:28px;bottom:20px;right:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gap{width:12px}
.stat{color:var(--mute);font:13px/1 ui-monospace,"SF Mono",Menlo,monospace;margin-left:10px}
.hz{position:fixed;z-index:4;font:500 44px/1 Charter,"PT Serif",Georgia,serif;letter-spacing:-.02em;pointer-events:none}
.hz small{display:block;margin-top:8px;font:12.5px/1.3 ui-monospace,Menlo,monospace;color:var(--mute);letter-spacing:0}
</style>
</head>
<body>
<canvas id="plate"></canvas>
<div class="hz" id="hz"></div>
<div class="hud">
  <div>
    <h1>Фигуры звука</h1>
    <p>Песок на дрожащей пластине сбегается туда, где она неподвижна. Ведите мышью по пластине – меняется нота и узор. Клик переворачивает фигуру.</p>
  </div>
  <nav class="nav"><a href="flyover.html">← Назад</a><a href="index.html">Все демо</a><a href="ocean.html">Дальше →</a></nav>
</div>
<div class="bar" id="bar"></div>
<script>
const cv = document.getElementById('plate'), ctx = cv.getContext('2d'), hz = document.getElementById('hz');
const PRE = [['Звезда', 1, 4], ['Решётка', 4, 6], ['Лепестки', 2, 5], ['Плетёнка', 3, 7], ['Кружево', 5, 9], ['Кольца', 6, 8]];
let N = 40000, S = 600, img, px, py;
let m = 3, n = 5, mT = 3, nT = 5, sign = -1, sweep = false, sound = false, held = 0;
function init() {
  px = new Float32Array(N); py = new Float32Array(N);
  for (let i = 0; i < N; i++) { px[i] = Math.random(); py[i] = Math.random(); }
}
function resize() {
  const css = Math.round(Math.min(innerHeight * .66, innerWidth * .5, 760)), d = Math.min(2, devicePixelRatio || 1);
  cv.style.width = cv.style.height = css + 'px'; S = cv.width = cv.height = Math.round(css * d);
  img = ctx.createImageData(S, S);
  const r = cv.getBoundingClientRect(); hz.style.left = r.right + 34 + 'px'; hz.style.top = r.top + 'px';
}
addEventListener('resize', resize);

const bar = document.getElementById('bar');
bar.innerHTML = PRE.map((p, i) => `<button class="pill" data-p="${i}">${p[0]}</button>`).join('') +
  '<span class="gap"></span><button class="pill" data-a="sweep">Развёртка</button><button class="pill" data-a="snd">Звук выключен</button><button class="pill" data-a="n">Песчинок: 40 000</button><span class="stat" id="stat"></span>';
bar.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { [, mT, nT] = PRE[+b.dataset.p]; sweep = false; held = performance.now() + 4000; mark(b); }
  else if (b.dataset.a === 'sweep') { sweep = !sweep; mark(sweep ? b : null); }
  else if (b.dataset.a === 'snd') { sound = !sound; b.classList.toggle('on', sound); b.textContent = sound ? 'Звук включён' : 'Звук выключен'; tone(); }
  else { N = N === 40000 ? 80000 : N === 80000 ? 20000 : 40000; b.textContent = 'Песчинок: ' + N.toLocaleString('ru-RU'); init(); }
});
const mark = b => bar.querySelectorAll('[data-p],[data-a="sweep"]').forEach(x => x.classList.toggle('on', x === b));
cv.addEventListener('pointermove', e => {
  if (sweep || performance.now() < held) return;
  const r = cv.getBoundingClientRect();
  mT = 1 + (e.clientX - r.left) / r.width * 9; nT = 1 + (e.clientY - r.top) / r.height * 9; mark(null);
});
cv.addEventListener('pointerdown', () => { sign = -sign; held = 0; });

// нота: чем сложнее узор, тем выше частота
let ac, osc, gain;
const freq = () => 46 * (m * m + n * n) / 2 + 60;
function tone() {
  if (sound && !ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)(); osc = ac.createOscillator(); gain = ac.createGain();
    osc.type = 'sine'; gain.gain.value = 0; osc.connect(gain).connect(ac.destination); osc.start();
  }
  if (ac) { ac.resume(); gain.gain.setTargetAtTime(sound ? .07 : 0, ac.currentTime, .05); }
}

const stat = document.getElementById('stat'), PI = Math.PI;
let frames = 0, fpsT = performance.now();
function frame(now) {
  if (sweep) { mT = 5 + 4 * Math.sin(now * .00023); nT = 5 + 4 * Math.cos(now * .00031); }
  const dm = mT - m, dn = nT - n, moving = Math.abs(dm) + Math.abs(dn);
  m += dm * .08; n += dn * .08;
  const a = m * PI, bq = n * PI, shake = .016 + Math.min(.05, moving * .04), d = img.data;
  d.fill(0);
  for (let i = 0; i < N; i++) {
    let x = px[i], y = py[i];
    // амплитуда колебаний пластины в этой точке; на узловых линиях она равна нулю
    const cbx = Math.cos(bq * x), cay = Math.cos(a * y), cax = Math.cos(a * x), cby = Math.cos(bq * y);
    const s = cbx * cay + sign * cax * cby;
    const gx = -bq * Math.sin(bq * x) * cay - sign * a * Math.sin(a * x) * cby, gy = -a * cbx * Math.sin(a * y) - sign * bq * cax * Math.sin(bq * y);
    const k = (Math.abs(s) + .15) * shake;
    // песчинку подбрасывает тем сильнее, чем сильнее дрожит пластина, и сносит к тихому месту
    x += (Math.random() - .5) * k - s * gx * .00011; y += (Math.random() - .5) * k - s * gy * .00011;
    if (x < 0) x = -x; else if (x > 1) x = 2 - x;
    if (y < 0) y = -y; else if (y > 1) y = 2 - y;
    px[i] = x; py[i] = y;
    const o = ((y * (S - 2) | 0) * S + (x * (S - 2) | 0)) * 4;
    for (const q of [o, o + 4, o + S * 4, o + S * 4 + 4]) { d[q] = Math.min(255, d[q] + 96); d[q + 1] = Math.min(255, d[q + 1] + 90); d[q + 2] = Math.min(255, d[q + 2] + 72); }
  }
  for (let i = 3; i < d.length; i += 4) d[i] = 255;
  ctx.putImageData(img, 0, 0);
  const f = freq();
  if (ac && sound) osc.frequency.setTargetAtTime(f, ac.currentTime, .03);
  hz.innerHTML = `${Math.round(f)} Гц<small>${sign < 0 ? 'разностная' : 'суммарная'} фигура<br>m ${m.toFixed(2)} · n ${n.toFixed(2)}</small>`;
  frames++;
  if (now - fpsT > 500) { stat.textContent = `${Math.round(frames * 1000 / (now - fpsT))} кадров/с`; frames = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
init(); resize(); requestAnimationFrame(frame);
if (location.search.includes('shot')) { mT = m = 4; nT = n = 7; const raf0 = window.requestAnimationFrame; window.requestAnimationFrame = () => 0; for (let i = 0; i < 320; i++) frame(performance.now()); window.requestAnimationFrame = raf0; }
</script>
</body>
</html>
