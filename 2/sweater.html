<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Свитер · Fable 5.2</title>
<style>
:root{--bg:#0c0c0b;--ink:#f2eee3;--acc:#ffd84d;--line:rgba(242,238,227,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;z-index:5;left:28px;top:22px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.hud h1{margin:0;font:500 34px/1.05 Charter,"Iowan Old Style","PT Serif",Georgia,serif;letter-spacing:-.01em}
.hud p{margin:8px 0 0;max-width:60ch;font-size:14.5px}
.nav{display:flex;gap:8px;pointer-events:auto;flex:none}
.nav a,.pill{border:1px solid var(--line);background:rgba(12,12,11,.6);color:var(--ink);padding:9px 14px;border-radius:999px;text-shadow:none;
  font-weight:500;font-size:13.5px;line-height:1;font-family:inherit;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav a:hover,.pill:hover{border-color:rgba(242,238,227,.7)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#14130f}
.bar{position:fixed;z-index:5;left:28px;bottom:20px;right:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=text]{width:150px;border:1px solid var(--line);background:rgba(12,12,11,.6);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 13.5px/1.1 inherit;outline:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar input[type=text]:focus{border-color:var(--acc)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(242,238,227,.35);cursor:pointer;padding:0}
.sw.on{border-color:var(--acc)}
.stat{font:13px/1 ui-monospace,"SF Mono",Menlo,monospace;margin-left:10px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>
    <h1>Свитер</h1>
    <p>Напишите слово – оно ввяжется в узор, петля за петлёй. Кликом по вязанию можно перекрасить отдельную петлю. А если потянуть мышкой клубок, свитер начнёт распускаться.</p>
  </div>
  <nav class="nav"><a href="frost.html">← Назад</a><a href="index.html">Все демо</a><a href="sand.html">Дальше →</a></nav>
</div>
<div class="bar">
  <button class="pill on" id="go">Пауза</button><button class="pill" id="un">Распустить</button>
  <input type="text" id="txt" maxlength="9" value="ПРИВЕТ" aria-label="Слово на свитере">
  <span id="pal"></span>
  <span class="stat" id="stat"></span>
</div>
<div class="err" id="err">Этому демо нужен WebGL 2. Откройте его в свежем Chrome или Safari.</div>
<script>
'use strict';
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT, uProg, uPull, uWork;
uniform vec4 uLay;            // начало вязания в пикселях и размер петли
uniform vec3 uAct, uBall, uC0, uC1, uC2; // игла, клубок (x, y, радиус), три цвета пряжи
uniform sampler2D uPat;       // узор: цвет петли, резинка, входит ли петля в выкройку
out vec4 O;
const float COLS = 60., ROWS = 48., ASP = .8;
const vec3 L = vec3(-.4264, .5222, .7385);
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 x){ vec2 p = floor(x), f = fract(x); f = f * f * (3. - 2. * f); return mix(mix(h21(p), h21(p + vec2(1, 0)), f.x), mix(h21(p + vec2(0, 1)), h21(p + vec2(1, 1)), f.x), f.y); }
vec4 cellAt(vec2 ij){ return ij.x < 0. || ij.y < 0. || ij.x >= COLS || ij.y >= ROWS ? vec4(0.) : texelFetch(uPat, ivec2(ij), 0); }
float knit(vec2 ij){ vec4 c = cellAt(ij); if (c.a < .5) return 0.; return clamp(uProg - ij.y * COLS - (mod(ij.y, 2.) < .5 ? ij.x : COLS - 1. - ij.x), 0., 1.); } // вяжем змейкой: ряд вправо, ряд влево
vec3 yarn(float i){ return i < .25 ? uC0 : i < .75 ? uC1 : uC2; }
vec3 tube(vec3 c, float nx, vec2 e, float t, float seed){ // нить: круглая в сечении, скручена из прядей, ворсистая
  vec3 n = vec3(e * nx, sqrt(max(1. - nx * nx, 0.)));
  float tw = .5 + .5 * sin(t * 26. + nx * 3.2 + seed * 6.);
  return c * (.3 + .85 * max(dot(n, L), 0.)) * (.8 + .2 * tw) * (.9 + .2 * vn(vec2(t * 40. + seed * 9., nx * 6.))) + vec3(.9) * .06 * pow(max(n.z, 0.), 6.);
}
void main(){
  vec2 s = (gl_FragCoord.xy - uLay.xy) / vec2(uLay.z, uLay.z * ASP), m = vec2(s.x, s.y * ASP), uv = gl_FragCoord.xy / uRes;
  // стол
  float g = vn(vec2(m.x * .22, m.y * 3.)), pl = smoothstep(.06, .0, abs(fract(m.y / 9. + .3) - .5) - .47);
  vec3 col = mix(vec3(.5, .36, .22), vec3(.62, .47, .3), .5 + .5 * sin(m.y * 5. + g * 7.)) * (.82 + .25 * g) * (1. - .45 * pl);
  float shd = 0.; for (int i = 0; i < 4; i++) { vec2 o = vec2(.7 + float(i) * .45, -.9 - float(i) * .5); shd += knit(floor(s + o)); } // тень вязания на столе
  col *= 1. - .1 * shd;
  // петли: в каждой клетке «галочка» из двух ножек; верхний ряд ложится поверх нижнего
  vec2 base = floor(s); float bz = -1., bnx = 0., bt = 0., fz = 0., bseed = 0.; vec2 be = vec2(0.); vec3 bc = vec3(0.), fc = vec3(0.);
  if (knit(base) > 0.) col = yarn(cellAt(base).r) * .22;
  for (int dj = -1; dj <= 0; dj++) for (int di = -1; di <= 1; di++) {
    vec2 ij = base + vec2(di, dj); float k = knit(ij); if (k <= 0.) continue; vec4 c = cellAt(ij);
    vec2 l = vec2(s.x - ij.x - .5, (s.y - ij.y) * ASP); bool purl = c.b > .5 && mod(ij.x, 2.) > .5; // в резинке через одну – изнаночные петли
    for (int sd = 0; sd < 2; sd++) { if (purl && sd == 1) break; float sg = sd == 0 ? -1. : 1.;
      vec2 A = purl ? vec2(-.4, .42) : vec2(sg * .07, -.1), B = purl ? vec2(.4, .42) : vec2(sg * .33, 1.), pa = l - A, ba = B - A;
      float t = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); vec2 e = pa - ba * t; float d = length(e), R = .21 * (.4 + .6 * k);
      if (d < R) { float z = sqrt(R * R - d * d) + .03 * ij.y + .012 * t; if (z > bz) { bz = z; bnx = d / R; be = e / max(d, 1e-4); bt = t + ij.y * 1.3; bc = yarn(c.r); bseed = h21(ij + sg); } }
      else if (d < R + .1) { float f = (1. - (d - R) / .1) * vn(gl_FragCoord.xy * .7); if (f > fz) { fz = f; fc = yarn(c.r); } }
    }
  }
  col = mix(col, fc * .7, fz * .8);
  if (bz > 0.) col = tube(bc, bnx, be, bt, bseed);
  // нить от спицы к клубку
  vec2 a = uAct.xy, b = uBall.xy, ctl = (a + b) * .5 + vec2(0., -3.5 - .15 * distance(a, b)); float td = 9., tt = 0.; vec2 te = vec2(0.), prev = a;
  for (int i = 1; i <= 16; i++) { float u = float(i) / 16.; vec2 q = mix(mix(a, ctl, u), mix(ctl, b, u), u); q += uPull * .3 * sin(u * 60.) * vec2(.6, 1.) * sin(u * 3.14159);
    vec2 pa = m - prev, ba = q - prev; float t = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); vec2 e = pa - ba * t; float d = length(e); if (d < td) { td = d; te = e / max(d, 1e-4); tt = u * 9.; } prev = q; }
  if (uWork > .01 && td < .14) col = tube(uC0, td / .14, te, tt, 3.);
  // клубок
  vec2 bd = m - uBall.xy; float br = length(bd);
  if (br < uBall.z + .9) col *= .6 + .4 * smoothstep(uBall.z - .2, uBall.z + .9, length(bd - vec2(.5, -.6)));
  if (br < uBall.z) { vec3 n = vec3(bd / uBall.z, sqrt(1. - br * br / (uBall.z * uBall.z))); float ang = h21(floor(bd * .55 + 5.)) * 3.14;
    float w = .5 + .5 * sin((bd.x * cos(ang) + bd.y * sin(ang) + n.z * 2.) * 9.);
    col = uC0 * (.25 + .9 * max(dot(n, L), 0.)) * (.72 + .28 * w) * (.9 + .2 * vn(bd * 9.)); }
  // спицы
  if (uWork > .5) for (int i = 0; i < 2; i++) { float wob = .14 * sin(uT * 17. + float(i) * 2.);
    vec2 tip = a + (i == 0 ? vec2(.35, .2 + wob) : vec2(-.25, .3 - wob)), end = a + (i == 0 ? vec2(-7., -1.6) : vec2(6.4, -4.));
    vec2 pa = m - tip, ba = end - tip; float t = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.), d = length(pa - ba * t), R = mix(.03, .2, smoothstep(0., .12, t));
    col *= .75 + .25 * smoothstep(R, R + .5, length(pa - ba * t - vec2(.35, -.4)));
    if (d < R) { float nx = d / R; col = mix(vec3(.78, .62, .4), vec3(.9, .78, .56), .5 + .5 * sin(t * 60.)) * (.45 + .7 * sqrt(1. - nx * nx)) + vec3(.25) * pow(1. - nx, 8.); } }
  col *= 1. - .4 * dot((uv - .5) * vec2(1.1, 1.3), (uv - .5) * vec2(1.1, 1.3));
  O = vec4(pow(clamp(col, 0., 1.), vec3(.4545)), 1.);
}`;

const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { antialias: false, alpha: false }), $ = id => document.getElementById(id);
if (!gl) $('err').style.display = 'flex';
else (function () {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr); const U = {}; ['uRes', 'uT', 'uProg', 'uPull', 'uWork', 'uLay', 'uAct', 'uBall', 'uC0', 'uC1', 'uC2', 'uPat'].forEach(n => U[n] = gl.getUniformLocation(pr, n));

  const COLS = 60, ROWS = 48, ASP = .8, TOTAL = COLS * ROWS, pat = new Uint8Array(COLS * ROWS * 4), tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const upPat = () => gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, COLS, ROWS, 0, gl.RGBA, gl.UNSIGNED_BYTE, pat);
  // выкройка: стан, два рукава, вырез горловины
  function shape(i, j) { const x = Math.abs(i - 29.5), top = 45.5 - (x - 15.5) * .62;
    if ((i - 29.5) ** 2 + (j - 47.5) ** 2 * 1.3 < 38) return 0;
    if (x < 15.5) return j < 46 ? ((j < 4 || (i - 29.5) ** 2 + (j - 47.5) ** 2 * 1.3 < 62) ? 2 : 1) : 0;
    return j <= top && j >= top - 12 + (x - 15.5) * .12 ? (x > 26.5 ? 2 : 1) : 0; }
  const tc = document.createElement('canvas'); tc.width = 30; tc.height = 12; const tg = tc.getContext('2d', { willReadFrequently: true });
  function build(word) { // узор: кайма зигзагом, слово на груди, звёзды на кокетке
    tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, 30, 12); tg.font = 'bold 12px "Helvetica Neue",Arial,sans-serif'; tg.textBaseline = 'alphabetic'; tg.fillStyle = '#fff';
    const w = tg.measureText(word).width || 1, k = Math.min(1, 28 / w); tg.setTransform(k, 0, 0, 1, 15 - w * k / 2, 0); tg.fillText(word, 0, 10.5); const px = tg.getImageData(0, 0, 30, 12).data;
    for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { const sp = shape(i, j), o = (j * COLS + i) * 4; let c = 0;
      if (j >= 5 && j <= 9) c = (i + Math.abs((j - 5) % 4 - 2)) % 4 === 0 ? 1 : j === 5 || j === 9 ? 2 : 0;
      if (j >= 19 && j <= 30 && i >= 15 && i < 45 && px[((30 - j) * 30 + (i - 15)) * 4 + 3] > 105) c = 1;
      if (j === 17 || j === 32) c = i % 2 ? 2 : 0;
      if (j >= 35 && j <= 43) { const dx = ((i + 3) % 12) - 6 + (i + 3 < 0 ? 12 : 0), dy = j - 39, ax = Math.abs(dx), ay = Math.abs(dy); if (Math.max(ax, ay) <= 4 && (ax === 0 || ay === 0 || ax === ay) && ax + ay > 0) c = 1; else if (ax === 6 && ay % 2 === 0) c = 2; }
      pat[o] = c === 0 ? 0 : c === 1 ? 127 : 255; pat[o + 1] = 0; pat[o + 2] = sp === 2 ? 255 : 0; pat[o + 3] = sp ? 255 : 0; }
    upPat();
  }
  const PAL = [[[.7, .09, .09], [.93, .9, .84], [.13, .17, .34]], [[.1, .2, .42], [.93, .92, .88], [.82, .27, .2]], [[.13, .34, .24], [.92, .87, .74], [.78, .33, .14]], [[.4, .41, .45], [.96, .8, .26], [.16, .16, .2]]];
  let pal = 0; const palEl = $('pal');
  PAL.forEach((p, i) => { const b = document.createElement('button'); b.className = 'sw' + (i ? '' : ' on'); b.style.background = `rgb(${p[0].map(v => Math.round(Math.pow(v, .4545) * 255))})`; b.title = 'Цвет пряжи'; b.onclick = () => { pal = i; [...palEl.children].forEach((c, k) => c.classList.toggle('on', k === i)); }; palEl.appendChild(b); palEl.append(' '); });

  // звук: стук спиц и шорох распускаемой нити
  let AC = null, nb, lastTick = 0;
  function audio() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); nb = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  function tick(f, v, dur) { if (!AC) return; const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = nb; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 3; s.connect(fl); fl.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0004, t + dur); s.start(t, Math.random() * .8, dur + .01); }

  let prog = 0, mode = 'knit', pull = 0, T = 0, last = 0, lay = { ox: 0, oy: 0, w: 10 }, ball = { x: 70, y: 6, drag: null };
  const go = $('go'), un = $('un');
  const ui = () => { go.textContent = mode === 'knit' ? 'Пауза' : 'Вязать'; go.classList.toggle('on', mode === 'knit'); un.classList.toggle('on', mode === 'unravel'); };
  go.onclick = () => { audio(); mode = mode === 'knit' ? 'pause' : 'knit'; ui(); };
  un.onclick = () => { audio(); mode = mode === 'unravel' ? 'pause' : 'unravel'; ui(); };
  $('txt').oninput = e => build(e.target.value.toUpperCase());
  addEventListener('keydown', e => { if (e.code === 'Space' && document.activeElement !== $('txt')) { e.preventDefault(); go.click(); } });
  const toS = e => { const d = cv.width / innerWidth; return [(e.clientX * d - lay.ox) / lay.w, ((innerHeight - e.clientY) * d - lay.oy) / (lay.w * ASP)]; };
  const ballR = () => 2.6 + 2.6 * (1 - prog / TOTAL);
  cv.addEventListener('pointerdown', e => { audio(); const [sx, sy] = toS(e), my = sy * ASP;
    if (Math.hypot(sx - ball.x, my - ball.y) < ballR() + .6) { ball.drag = { x: sx, y: my }; cv.setPointerCapture(e.pointerId); mode = 'pause'; ui(); return; }
    const i = Math.floor(sx), j = Math.floor(sy); if (i < 0 || j < 0 || i >= COLS || j >= ROWS || !shape(i, j)) return; // клик по петле меняет её цвет
    const o = (j * COLS + i) * 4; pat[o] = pat[o] === 0 ? 127 : pat[o] === 127 ? 255 : 0; upPat(); tick(2400, .12, .03); });
  cv.addEventListener('pointermove', e => { const [sx, sy] = toS(e), my = sy * ASP;
    if (!ball.drag) { cv.style.cursor = Math.hypot(sx - ball.x, my - ball.y) < ballR() + .6 ? 'grab' : 'crosshair'; return; }
    const d = Math.hypot(sx - ball.drag.x, my - ball.drag.y); ball.x += sx - ball.drag.x; ball.y += my - ball.drag.y; ball.drag = { x: sx, y: my };
    prog = Math.max(0, prog - d * 9); pull = Math.min(1, pull + d * .4); if (d > .05 && T - lastTick > .03) { lastTick = T; tick(900 + Math.random() * 600, .05, .04); } });
  addEventListener('pointerup', () => { ball.drag = null; });

  let scale = 1, ema = 16, lastChange = 0;
  function resize() { const d = Math.min(2, devicePixelRatio || 1) * scale; cv.width = Math.max(2, Math.round(innerWidth * d)); cv.height = Math.max(2, Math.round(innerHeight * d)); gl.viewport(0, 0, cv.width, cv.height);
    lay.w = Math.min(cv.width * .62 / COLS, cv.height * .7 / (ROWS * ASP)); lay.ox = cv.width * .47 - COLS * lay.w / 2; lay.oy = cv.height * .46 - ROWS * ASP * lay.w / 2; }
  addEventListener('resize', resize); resize(); build('ПРИВЕТ'); ui();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || .016); if (last && now - last < 100) ema += ((now - last) - ema) * .08; // долгие кадры – это фоновая вкладка, а не медленная видеокарта last = now; T += dt;
    if (now - lastChange > 1200 && document.visibilityState === 'visible') {
      if (ema > 24 && scale > .4) { scale = Math.max(.4, scale * .85); lastChange = now; ema = 17; resize(); }
      else if (ema < 15 && scale < 1 && now - lastChange > 5000) { scale = Math.min(1, scale + .1); lastChange = now; ema = 17; resize(); }
    }
    const p0 = prog;
    if (mode === 'knit') { prog = Math.min(TOTAL, prog + dt * 150); if (prog >= TOTAL) { mode = 'pause'; ui(); } if (T - lastTick > .09) { lastTick = T; tick(3000 + Math.random() * 1200, .06, .02); } }
    if (mode === 'unravel') { prog = Math.max(0, prog - dt * 520); pull = Math.min(1, pull + dt * 4); if (T - lastTick > .035) { lastTick = T; tick(800 + Math.random() * 500, .04, .04); } if (prog <= 0) { mode = 'pause'; ui(); } }
    pull *= Math.exp(-dt * 3);
    const k = Math.max(0, Math.min(TOTAL - 1, Math.floor(prog))), j = Math.floor(k / COLS), i = j % 2 === 0 ? k % COLS : COLS - 1 - k % COLS;
    $('stat').textContent = `связано ${Math.round(prog)} из ${TOTAL} петель · ряд ${j + 1} из ${ROWS} · клубок можно тянуть мышкой`;
    gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uT, T); gl.uniform1f(U.uProg, prog); gl.uniform1f(U.uPull, pull); gl.uniform1f(U.uWork, prog >= TOTAL ? 0 : mode === 'knit' ? 1 : .4);
    gl.uniform4f(U.uLay, lay.ox, lay.oy, lay.w, 0); gl.uniform3f(U.uAct, i + .5, (j + .7) * ASP, 0); gl.uniform3f(U.uBall, ball.x, ball.y, ballR());
    gl.uniform3fv(U.uC0, PAL[pal][0]); gl.uniform3fv(U.uC1, PAL[pal][1]); gl.uniform3fv(U.uC2, PAL[pal][2]); gl.uniform1i(U.uPat, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame);
  }
  window.__w = { get s() { return { scale, ema: Math.round(ema), prog: Math.round(prog), mode, pal }; }, set(o) { if (o.prog != null) prog = o.prog; if (o.mode) { mode = o.mode; ui(); } } };
  requestAnimationFrame(frame);
})();
</script>
</body>
