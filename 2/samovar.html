<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>
    <h1>Самовар</h1>
    <p>Латунь, в которой отражаются окно, скатерть и чашка. Ни комнату, ни отражения никто не рисовал: они считаются для каждого пикселя. Растопите самовар, дождитесь, пока он запоёт, и поверните краник.</p>
  </div>
  <nav class="nav"><a href="snowglobe.html">← Назад</a><a href="index.html">Все демо</a><a href="frost.html">Дальше →</a></nav>

const FS = `#version 300 es

vec3 cloth(vec2 p, float far){ // скатерть: лён с красной вышитой клеткой; вдали узор сливается в ровный тон

vec3 matte(vec3 p, vec3 n, float m, float sh){

    if (flow) { level = Math.min(1, level + dt / 4.5); if (level >= 1) { tapOpen = false; click(.3); ui(); } }
    if (drinking) { level = Math.max(0, level - dt / 1.2); if (level <= 0) { drinking = false; ui(); } }
    if (AC) { const t = AC.currentTime, sg = Math.max(0, Math.min(1, (heat - .45) / .35)) * (1 - .65 * Math.max(0, (heat - .9) / .1)), bo = Math.max(0, (heat - .82) / .18);
      gSing.gain.setTargetAtTime(.05 * sg, t, .2); sing.forEach((o, i) => o.frequency.setTargetAtTime((560 + 260 * heat) * [1, 1.498, 2.01][i], t, .3));
      gHiss.gain.setTargetAtTime(.012 * fireV + .03 * sg, t, .2); gBoil.gain.setTargetAtTime(.35 * bo * (.7 + .3 * Math.sin(T * 9)), t, .1);
      gPour.gain.setTargetAtTime(flow ? .1 : 0, t, .05); fPour.frequency.setTargetAtTime(600 + 900 * level, t, .1);
      if (fireV > .3 && Math.random() < dt * 5) click(.03 + Math.random() * .08); if (bo > .1 && Math.random() < dt * 14 * bo) blip(); }
    const temp = Math.round(20 + 80 * heat);
    stat.innerHTML = `вода ${temp}° · ` + (heat > .97 ? '<b>кипит</b>' : heat > .5 ? '<b>самовар поёт</b>' : fire ? 'греется' : heat > .05 ? 'остывает' : 'холодный') + (level > .01 ? ` · в чашке ${Math.round(level * 200)} мл` : '') + ' · краник можно повернуть мышкой';
    return flow;
  }

  let yaw = .5, pitch = .2, dist = 4.3, drag = null; const F = 2.6, TG = [0, .62, .08]; let ro, fw, ri, up;
  const nrm = v => { const l = Math.hypot(...v); return v.map(x => x / l); }, crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  function cam() { const cp = Math.cos(pitch); ro = [TG[0] + dist * Math.sin(yaw) * cp, TG[1] + dist * Math.sin(pitch), TG[2] + dist * Math.cos(yaw) * cp]; fw = nrm(TG.map((v, i) => v - ro[i])); ri = nrm(crs(fw, [0, 1, 0])); up = crs(ri, fw); }
  const onTap = e => { const q = [0, .46, .44].map((v, i) => v - ro[i]), z = dot(q, fw), k = F / z * innerHeight / 2; return Math.hypot(e.clientX - innerWidth / 2 - dot(q, ri) * k, e.clientY - innerHeight / 2 + dot(q, up) * k) < 38; };
  cv.addEventListener('pointerdown', e => { audio(); drag = { x: e.clientX, y: e.clientY, moved: 0, tap: onTap(e) }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointermove', e => { if (!drag) { cv.style.cursor = onTap(e) ? 'pointer' : 'grab'; return; } const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 5) { yaw -= dx * .006; pitch = Math.max(.03, Math.min(1.1, pitch + dy * .004)); } });
  addEventListener('pointerup', () => { if (drag && drag.tap && drag.moved < 6) toggleTap(); drag = null; cv.style.cursor = 'grab'; });
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(1.6, Math.min(9, dist * Math.exp(e.deltaY * .001))); }, { passive: false });

  let scale = .8, ema = 16, lastChange = 0, last = 0;
  function resize() { const d = Math.min(1.5, devicePixelRatio || 1) * scale; cv.width = Math.max(2, Math.round(innerWidth * d)); cv.height = Math.max(2, Math.round(innerHeight * d)); gl.viewport(0, 0, cv.width, cv.height); }
  addEventListener('resize', resize); resize(); ui();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || .016); if (last && now - last < 100) ema += ((now - last) - ema) * .08; // долгие кадры – это фоновая вкладка, а не медленная видеокарта last = now; T += dt;
    if (now - lastChange > 1200 && document.visibilityState === 'visible') {
      if (ema > 24 && scale > .3) { scale = Math.max(.3, scale * (ema > 40 ? .7 : .87)); lastChange = now; ema = 17; resize(); }
      else if (ema < 15 && scale < 1 && now - lastChange > 5000) { scale = Math.min(1, scale + .1); lastChange = now; ema = 17; resize(); }
    }
    const flow = step(dt); cam();
    gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uT, T); gl.uniform3fv(U.uRo, ro); gl.uniform3fv(U.uRi, ri); gl.uniform3fv(U.uUp, up); gl.uniform3fv(U.uFw, fw);
    gl.uniform4f(U.uS, fireV, heat, tapA, level); gl.uniform1f(U.uFlow, flow ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame);
  }
  window.__s = { get s() { return { scale, ema: Math.round(ema), fire, heat: +heat.toFixed(2), tapOpen, level: +level.toFixed(2) }; }, set(o) { if (o.yaw != null) yaw = o.yaw; if (o.pitch != null) pitch = o.pitch; if (o.dist != null) dist = o.dist; if (o.heat != null) heat = o.heat; if (o.level != null) level = o.level; } };
  requestAnimationFrame(frame);
})();
