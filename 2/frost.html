<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Иней на стекле · Fable 5.2</title>
<style>
:root{--bg:#0c0c0b;--ink:#f2eee3;--acc:#ffd84d;--line:rgba(242,238,227,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;z-index:5;left:28px;top:22px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.85)}
.hud h1{margin:0;font:500 34px/1.05 Charter,"Iowan Old Style","PT Serif",Georgia,serif;letter-spacing:-.01em}
.hud p{margin:8px 0 0;max-width:62ch;font-size:14.5px}
.nav{display:flex;gap:8px;pointer-events:auto;flex:none}
.nav a,.pill{border:1px solid var(--line);background:rgba(12,12,11,.55);color:var(--ink);padding:9px 14px;border-radius:999px;text-shadow:none;
  font-weight:500;font-size:13.5px;line-height:1;font-family:inherit;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav a:hover,.pill:hover{border-color:rgba(242,238,227,.7)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#14130f}
.bar{position:fixed;z-index:5;left:28px;bottom:20px;right:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar label{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(12,12,11,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar input{accent-color:var(--acc);width:130px}
.stat{font:13px/1 ui-monospace,"SF Mono",Menlo,monospace;margin-left:10px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>
    <h1>Иней на стекле</h1>
    <p>Узор растёт сам и каждый раз получается новым. Зажмите мышку и «подышите» на стекло: иней оттает, и станет виден двор. Можно написать слово пальцем. Отпустите – зарастёт снова.</p>
  </div>
  <nav class="nav"><a href="samovar.html">← Назад</a><a href="index.html">Все демо</a><a href="sweater.html">Дальше →</a></nav>
</div>
<div class="bar">
  <button class="pill on" id="new">Новый узор</button><label>Мороз <input type="range" id="cold" min="5" max="35" step="1" value="20"></label><button class="pill on" id="snd">Звук</button>
  <span class="stat" id="stat"></span>
</div>
<div class="err" id="err">Этому демо нужен WebGL 2. Откройте его в свежем Chrome или Safari.</div>
<script>
'use strict';
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT, uSeed, uCold;
uniform sampler2D uAge; // сколько инея наросло в каждой точке: мышка стирает, мороз наращивает
out vec4 O;
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 h22(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
float vn(vec2 x){ vec2 p = floor(x), f = fract(x); f = f * f * (3. - 2. * f); return mix(mix(h21(p), h21(p + vec2(1, 0)), f.x), mix(h21(p + vec2(0, 1)), h21(p + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float a = 0., b = .5; for (int i = 0; i < 4; i++) { a += b * vn(p); p = p * 2.03 + 7.1; b *= .5; } return a; }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)); }
float box(vec2 p, vec2 c, vec2 h, float bl){ vec2 d = abs(p - c) - h; return smoothstep(bl, -bl, max(d.x, d.y)); }

// ---------- Двор за окном; bl – насколько размыто (сквозь иней видно мутно) ----------
vec3 house(vec2 q, vec2 c, vec2 h, vec3 wall, float bl, float id){
  vec2 g = (q - c + h) / vec2(.052, .062), cell = floor(g), f = fract(g) - .5; float lit = h21(cell + id * 17.);
  vec3 w = lit > .62 ? (lit > .93 ? vec3(.45, .7, 1.) : vec3(1., .72, .36)) * (.8 + .5 * fract(lit * 7.)) : vec3(.03, .04, .07);
  float wm = smoothstep(.3 + bl * 9., .26 - bl * 9., max(abs(f.x), abs(f.y) * .9)) * step(cell.y, floor(2. * h.y / .062) - 1.);
  return mix(wall, w, wm);
}
vec3 yard(vec2 q, float bl){
  vec3 c = mix(vec3(.16, .14, .24), vec3(.035, .05, .13), smoothstep(-.15, .5, q.y));
  c = mix(c, house(q, vec2(-.52, .04), vec2(.33, .17), vec3(.075, .085, .13), bl, 1.), box(q, vec2(-.52, .04), vec2(.33, .17), .004 + bl));
  c = mix(c, house(q, vec2(.62, .1), vec2(.3, .25), vec3(.06, .07, .11), bl, 2.), box(q, vec2(.62, .1), vec2(.3, .25), .004 + bl));
  float gy = -.14 + .02 * sin(q.x * 5.) + .012 * sin(q.x * 13. + 2.); vec2 lp = vec2(.1, .15);
  float pool = exp(-dot((q - vec2(.1, -.2)) * vec2(1., 3.2), (q - vec2(.1, -.2)) * vec2(1., 3.2)) * 7.);
  c = mix(c, vec3(.22, .28, .42) * (.75 + .5 * vn(q * vec2(9., 40.))) + vec3(1., .62, .28) * .55 * pool, smoothstep(bl + .004, -bl - .004, q.y - gy));
  float tr = min(min(seg(q, vec2(-.3, -.2), vec2(-.29, .1)) - .012, seg(q, vec2(-.29, .1), vec2(-.38, .26)) - .006), min(seg(q, vec2(-.29, .05), vec2(-.2, .22)) - .005, seg(q, vec2(-.33, .19), vec2(-.3, .3)) - .003));
  tr = min(tr, min(seg(q, vec2(-.23, .16), vec2(-.16, .2)) - .003, seg(q, vec2(-.29, .12), vec2(-.26, .32)) - .004));
  c = mix(c, vec3(.02, .022, .035), smoothstep(bl + .003, -bl - .003, tr));                                   // дерево
  c = mix(c, vec3(.015, .018, .03), smoothstep(bl + .003, -bl - .003, seg(q, vec2(.1, -.16), lp) - .004));  // фонарь
  float ld = length(q - lp); c += vec3(1., .68, .32) * (.9 * exp(-ld * ld / (.0006 + bl * .02)) + .22 * exp(-ld * 9.));
  float cone = smoothstep(.22, 0., abs(q.x - lp.x) - (lp.y - q.y) * .45) * step(q.y, lp.y) * smoothstep(-.3, 0., q.y - gy + .05);
  c += vec3(1., .66, .3) * .1 * cone;
  if (bl < .02) for (int l = 0; l < 2; l++) { float s = l == 0 ? 26. : 44.; vec2 g = q * s + vec2(sin(uT * .3 + float(l)) * .6, uT * (1.6 + float(l))), id = floor(g), f = fract(g) - .5; vec2 o = (h22(id) - .5) * .7;
    c += vec3(.8, .85, 1.) * smoothstep(.09, .03, length(f - o)) * step(.6, h21(id + 3.)) * (.3 + 2.2 * cone); }
  return c;
}
// ---------- Ледяной папоротник: стебель, от него ветки ёлочкой, от веток – веточки ----------
float twig(vec2 q, float len){ // q.x вдоль ветки
  if (q.x < 0. || q.x > len || len < .004) return 0.;
  float s = .007, k = floor(q.x / s), u = q.x - (k + .5) * s, v = abs(q.y), bu = u * .57 + v * .82, bv = abs(-u * .82 + v * .57), lb = (len - (k + .5) * s) * .5;
  float t = bu > 0. && bu < lb ? smoothstep(.0024, .0006, bv) * (1. - bu / lb) : 0.;
  return max(t, smoothstep(.0034, .0008, v) * (1. - q.x / len));
}
float fern(vec2 q, float len, float seed){ // q.x вдоль стебля
  if (q.x < 0. || q.x > len) return 0.;
  float s = .024, v = abs(q.y), h = smoothstep(.0055, .0012, v) * (1.15 - q.x / len);
  for (int i = 0; i < 2; i++) { float k = floor(q.x / s) - float(i); if (k < 0.) continue; float u = q.x - (k + .5) * s, lb = (len - (k + .5) * s) * .62 * (.55 + .45 * h21(vec2(k, seed)));
    h = max(h, twig(vec2(u * .57 + v * .82, -u * .82 + v * .57), lb) * (1.1 - q.x / len)); }
  return h;
}
// Узлы кристаллизации: из каждого расходится звезда из ветвей и растёт от центра наружу
float frost(vec2 p, float age){
  float best = 0.; vec2 g = p * 2.7 + uSeed, id = floor(g);
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++) {
    vec2 c = id + vec2(i, j) + step(.5, fract(g)) - 1. + .5, hh = h22(c), site = (c + (hh - .5) * .7 - uSeed) / 2.7, d = p - site;
    float n = 5. + floor(hh.x * 3.), r = length(d), a0 = atan(d.y, d.x) + hh.y * 6.28, sec = 6.2831853 / n;
    float a = mod(a0 + r * (hh.x - .5) * 5., sec) - sec * .5, len = .24 + .16 * h21(c + floor(a0 / sec));
    float h = max(fern(vec2(r * cos(a), r * sin(a)), len, hh.x * 31.), smoothstep(.012, .0, r) * 1.2);
    best = max(best, h * smoothstep(0., .12, age * 1.7 - r / .4 - hh.y * .4));
  }
  return best;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x / uRes.y; vec2 p = (uv - .5) * vec2(asp, 1.);
  // рама: коробка, вертикальный переплёт и форточка
  float ex = asp * .5 - .07 - abs(p.x), eyT = .44 - p.y, eyB = p.y + .385, mv = abs(p.x) - .02, mh = abs(p.y - .2) - .017;
  float edge = min(min(ex, min(eyT, eyB)), min(mv, mh));
  if (edge < 0.) { // крашеная деревянная рама: в комнате темно, кромки подсвечены с улицы
    bool vert = ex < 0. || (mv < 0. && mh > 0.);
    float grain = vert ? vn(vec2(p.x * 130., p.y * 3.)) : vn(vec2(p.x * 3., p.y * 130.));
    vec3 c = vec3(.05, .047, .046) * (.8 + .35 * grain) + vec3(.16, .2, .3) * .55 * smoothstep(-.014, 0., edge) + vec3(.5, .3, .12) * .05 * smoothstep(.5, -.5, p.y);
    if (p.y < -.385) c += vec3(.1, .12, .17) * smoothstep(-.41, -.385, p.y); // подоконник
    O = vec4(pow(c, vec3(.4545)), 1.); return;
  }
  float age = texture(uAge, uv).r * (.55 + .03 * uCold);
  float fernA = frost(p, age), hoarA = smoothstep(0., .3, age * .9 - edge * 11. - (fbm(p * 7. + uSeed) - .5) * 1.3); // изморозь ползёт от рам к середине
  float cry = vn(p * 55.) * .6 + vn(p * 130. + 3.) * .4;                               // мелкие кристаллы
  float H = max(fernA, hoarA * (.8 + .2 * vn(p * 40.))), cover = clamp(max(fernA * 1.5, hoarA), 0., 1.);
  vec3 n = normalize(vec3(-dFdx(H), -dFdy(H), 2.5 / uRes.y * 9.));
  vec3 sharp = cover < .98 ? yard(p + n.xy * .01, 0.) : vec3(0.), soft = cover > .02 ? yard(p + n.xy * .05, .035 + .03 * cover) : vec3(0.);
  float wet = (1. - texture(uAge, uv).r) * smoothstep(.0, .5, texture(uAge, uv).r + .2);  // по краю проталины стекло мокрое
  vec3 ice = mix(vec3(.5, .6, .78), soft * 1.5 + .06, .55) * (.68 + .5 * n.y + .18 * cry) + vec3(.9, .95, 1.) * pow(max(dot(n, normalize(vec3(.3, .5, .8))), 0.), 24.) * .5;
  ice += vec3(1.) * step(.991, h21(floor(p * 260.))) * smoothstep(.5, .1, length(fract(p * 260.) - .5)) * (.4 + .6 * sin(uT * 3. + h21(floor(p * 260.) + 1.) * 40.)) * cover; // искры
  vec3 col = mix(sharp, ice, cover * (.82 + .18 * H));
  col += vec3(1., .75, .45) * .035 * smoothstep(.5, .1, length((p - vec2(asp * .25, .28)) * vec2(1., 1.6))) + vec3(.6, .7, 1.) * .02 * wet; // отсвет комнаты в стекле
  col *= smoothstep(0., .02, edge) * .35 + .65;
  col *= 1. - .35 * dot(p * vec2(.6 / asp * 1.6, .9), p * vec2(.6 / asp * 1.6, .9));
  O = vec4(pow(clamp(col, 0., 1.), vec3(.4545)) + (h21(gl_FragCoord.xy + fract(uT) * 91.) - .5) / 255., 1.);
}`;

const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { antialias: false, alpha: false }), $ = id => document.getElementById(id);
if (!gl) $('err').style.display = 'flex';
else (function () {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr); const U = {}; ['uRes', 'uT', 'uSeed', 'uCold', 'uAge'].forEach(n => U[n] = gl.getUniformLocation(pr, n));

  // «возраст» инея – маленький холст: мороз его понемногу белит, дыхание чернит
  const ac = document.createElement('canvas'); ac.width = 320; ac.height = 200; const ag = ac.getContext('2d');
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fill = v => { ag.globalCompositeOperation = 'source-over'; ag.fillStyle = `rgb(${v},${v},${v})`; ag.fillRect(0, 0, 320, 200); };
  let seed = Math.random() * 50, cold = 20, acc = 0, breath = null, sndOn = true, T = 0, last = 0, melted = 0;
  fill(120);
  function thaw(x, y, r, a) { const px = x / innerWidth * 320, py = y / innerHeight * 200, rr = r / innerWidth * 320; ag.globalCompositeOperation = 'source-over';
    const g = ag.createRadialGradient(px, py, 0, px, py, rr); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.6, `rgba(0,0,0,${a * .7})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ag.fillStyle = g; ag.fillRect(px - rr, py - rr, rr * 2, rr * 2); }

  // звук: дыхание, потрескивание льда, ветер за окном
  let AC = null, gB, gW, nb;
  function audio() {
    if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = (type, f, q) => { const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = nb; s.loop = true; fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(); return g; };
    gB = src('bandpass', 850, .6); gW = src('lowpass', 240, 1.2);
  }
  function crack() { if (!AC || !sndOn) return; const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = nb; f.type = 'highpass'; f.frequency.value = 3500 + Math.random() * 4000; s.connect(f); f.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(.025 + Math.random() * .03, t); g.gain.exponentialRampToValueAtTime(.0004, t + .03); s.start(t, Math.random(), .04); }

  cv.addEventListener('pointerdown', e => { audio(); cv.setPointerCapture(e.pointerId); breath = { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY }; });
  cv.addEventListener('pointermove', e => { if (breath) { breath.px = breath.x; breath.py = breath.y; breath.x = e.clientX; breath.y = e.clientY; const n = Math.ceil(Math.hypot(breath.x - breath.px, breath.y - breath.py) / 12); for (let i = 1; i <= n; i++) thaw(breath.px + (breath.x - breath.px) * i / n, breath.py + (breath.y - breath.py) * i / n, 46, .5); melted += n; } });
  addEventListener('pointerup', () => { breath = null; });
  $('new').onclick = () => { audio(); seed = Math.random() * 50; fill(0); };
  $('cold').oninput = e => { cold = +e.target.value; };
  $('snd').onclick = e => { sndOn = !sndOn; e.target.classList.toggle('on', sndOn); if (sndOn) audio(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('new').click(); } });

  let scale = 1, ema = 16, lastChange = 0;
  function resize() { const d = Math.min(2, devicePixelRatio || 1) * scale; cv.width = Math.max(2, Math.round(innerWidth * d)); cv.height = Math.max(2, Math.round(innerHeight * d)); gl.viewport(0, 0, cv.width, cv.height); }
  addEventListener('resize', resize); resize();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || .016); if (last && now - last < 100) ema += ((now - last) - ema) * .08; // долгие кадры – это фоновая вкладка, а не медленная видеокарта last = now; T += dt;
    if (now - lastChange > 1200 && document.visibilityState === 'visible') {
      if (ema > 24 && scale > .35) { scale = Math.max(.35, scale * (ema > 40 ? .7 : .87)); lastChange = now; ema = 17; resize(); }
      else if (ema < 15 && scale < 1 && now - lastChange > 5000) { scale = Math.min(1, scale + .1); lastChange = now; ema = 17; resize(); }
    }
    if (breath) thaw(breath.x, breath.y, 62 + 26 * Math.sin(T * 2.2), .22); // держишь – проталина ширится
    acc += dt * 255 / (70 - cold * 1.6); const st = Math.floor(acc);           // чем крепче мороз, тем быстрее зарастает
    if (st > 0) { acc -= st; ag.globalCompositeOperation = 'lighter'; ag.fillStyle = `rgb(${st},${st},${st})`; ag.fillRect(0, 0, 320, 200); if (Math.random() < .5) crack(); }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ac);
    if (AC) { const t = AC.currentTime; gB.gain.setTargetAtTime(breath && sndOn ? .09 * (.6 + .4 * Math.sin(T * 2.2)) : 0, t, .12); gW.gain.setTargetAtTime(sndOn ? .05 + .03 * Math.sin(T * .4) * Math.sin(T * .17) : 0, t, .5); }
    $('stat').textContent = `за окном −${cold}° · зажмите мышку, чтобы оттаять · пробел – новый узор`;
    gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uT, T); gl.uniform1f(U.uSeed, seed); gl.uniform1f(U.uCold, cold); gl.uniform1i(U.uAge, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame);
  }
  window.__f = { get s() { return { scale, ema: Math.round(ema), seed: +seed.toFixed(1), melted }; }, age: v => fill(v), thaw };
  requestAnimationFrame(frame);
})();
</script>
</body>
