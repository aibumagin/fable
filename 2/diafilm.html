<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Диафильм · Fable 5.2</title>
<style>
:root{--bg:#0c0c0b;--ink:#f2eee3;--acc:#ffd84d;--line:rgba(242,238,227,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0a08;color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
#film{position:fixed;left:0;top:0;mix-blend-mode:screen;transform-origin:50% 50%;will-change:filter}
.hud{position:fixed;z-index:5;left:28px;top:22px;right:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.hud h1{margin:0;font:500 34px/1.05 Charter,"Iowan Old Style","PT Serif",Georgia,serif;letter-spacing:-.01em}
.hud p{margin:8px 0 0;max-width:30ch;font-size:14.5px}
.nav{display:flex;gap:8px;pointer-events:auto;flex:none}
.nav a,.pill{border:1px solid var(--line);background:rgba(12,12,11,.6);color:var(--ink);padding:9px 14px;border-radius:999px;text-shadow:none;
  font-weight:500;font-size:13.5px;line-height:1;font-family:inherit;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav a:hover,.pill:hover{border-color:rgba(242,238,227,.7)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#14130f}
.bar{position:fixed;z-index:5;left:28px;bottom:20px;right:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.bar>*{pointer-events:auto}
.bar label{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 6px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.bar input[type=range]{width:130px;accent-color:var(--acc)}
.stat{font:13px/1 ui-monospace,"SF Mono",Menlo,monospace;margin-left:10px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
@media (max-width:1000px){.hud p{display:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="film" width="800" height="600"></canvas>
<canvas id="fx"></canvas>
<div class="hud">
  <div>
    <h1>Диафильм</h1>
    <p>Сказку и все девять кадров Fable придумала и нарисовала сама. Крути ручку проектора или жми стрелки. Резкость наводится ползунком.</p>
  </div>
  <nav class="nav"><a href="coupe.html">← Назад</a><a href="index.html">Все демо</a></nav>
</div>
<div class="bar">
  <button class="pill" id="prev">◀ Назад</button><button class="pill" id="next">Дальше ▶</button>
  <label>Резкость <input type="range" id="focus" min="0" max="100" value="50"></label>
  <button class="pill on" id="lamp">Лампа</button><button class="pill on" id="snd">Звук</button>
  <span class="stat" id="stat"></span>
</div>
